components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Amazon Cognito / OAuth2 Bearer JWT authorization header. Example:
        ''Bearer <token>'''
  parameters:
    RefundIdPathParam:
      name: refundId
      in: path
      required: true
      description: Unique identifier of the refund request (e.g. `ref_543c86069f0f`).
      schema:
        type: string
        pattern: ^ref_[a-zA-Z0-9]+$
      example: ref_543c86069f0f
  responses:
    ProblemBadRequest:
      description: Bad Request - Malformed request parameters or invalid payload syntax.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:problem:bad-request
            title: Bad Request
            status: 400
            detail: The request query parameters could not be parsed.
            instance: /v1/refunds
    ProblemNotFound:
      description: Not Found - The specified resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:problem:not-found
            title: Resource Not Found
            status: 404
            detail: Refund request 'ref_nonexistent123' not found.
            instance: /v1/refunds/ref_nonexistent123
    ProblemPayloadTooLarge:
      description: Payload Too Large - Uploaded evidence exceeds maximum file size
        limit (5MB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:problem:payload-too-large
            title: Payload Too Large
            status: 413
            detail: File size exceeds maximum allowed limit of 5.0 MB.
            instance: /v1/refunds/ref_543c86069f0f/evidence
      x-source: backend/app/api/refunds.py:HTTP_413_STATUS
    ProblemUnprocessableEntity:
      description: Unprocessable Content - Request payload failed schema validation
        rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: urn:problem:validation-error
            title: Validation Error
            status: 422
            detail: One or more fields in the request body failed validation.
            instance: /v1/refunds
            invalidParams:
            - name: orderId
              reason: Field cannot be blank or empty.
    ProblemInternalServerError:
      description: Internal Server Error - An unexpected error occurred while processing
        the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:problem:internal-server-error
