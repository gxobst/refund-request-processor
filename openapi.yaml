        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/refunds/export/jobs/{job_id}/download:
    get:
      tags:
      - refunds
      summary: Download bulk export file
      description: Download the generated export file from local filesystem or redirect
        to S3.
      operationId: download_bulk_export_v1_refunds_export_jobs__job_id__download_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/refunds/export/jobs/{job_id}:
    get:
      tags:
