openapi: 3.1.0
info:
  title: AI Refund Request Processor API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: Automated back-office e-commerce refund evaluation engine powered by
    LangGraph, AWS Bedrock (Amazon Nova 2 / Claude), and DynamoDB. Provides asynchronous
    multi-agent evaluation, queue status polling, multimodal evidence verification,
    operational analytics, and human-in-the-loop clarifications and decision overrides.
servers:
- url: http://127.0.0.1:8000
  description: Local development server
- url: http://localhost:8000
  description: Local alternative host
tags:
- name: Service
  description: Application health, metadata, and status checks
- name: Refunds
  description: Refund request lifecycle, queue polling, and evaluations
- name: Evidence
  description: Photo evidence upload, inspection, and quarantine management
- name: Policies
  description: Refund policy configuration, audit history, and rollbacks
- name: Analytics
  description: Operational metrics, trend analytics, and report exports
- name: Exports
  description: Bulk asynchronous exports and scheduled report deliveries
security: []
paths:
  /v1/refunds:
    get:
      tags:
      - refunds
      summary: List refund requests with optional status filtering
      description: Retrieve refund queue records with optional status filtering.
      operationId: list_refund_requests_v1_refunds_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - completed
            - escalated
            - awaiting_clarification
            type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundRecord'
                title: Response List Refund Requests V1 Refunds Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - refunds
      summary: Submit a refund request for automated evaluation
      description: Accept and initiate asynchronous multi-agent processing for a refund
        request.
      operationId: submit_refund_request_v1_refunds_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundCreateResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  pattern: ^ORD-\d{4}$
                  description: Identifier of the order to evaluate.
                customer_request_text:
                  type: string
                  description: Customer explanation for the refund request.
              required:
              - order_id
              - customer_request_text
          multipart/form-data:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  pattern: ^ORD-\d{4}$
                  description: Identifier of the order to evaluate.
                customer_request_text:
                  type: string
                  description: Customer explanation for the refund request.
                file:
                  type: string
                  format: binary
                  description: Optional supporting evidence image file.
              required:
              - order_id
              - customer_request_text
  /v1/refunds/{refund_id}/override:
    post:
      tags:
      - refunds
      summary: Manually override a refund request decision
      description: Apply a human operator decision override to a refund request.
      operationId: override_refund_decision_v1_refunds__refund_id__override_post
      parameters:
      - name: refund_id
        in: path
        required: true
        schema:
          type: string
          title: Refund Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/refunds/events:
    get:
      tags:
      - refunds
      summary: Subscribe to real-time refund server-sent events (SSE)
      description: Stream real-time refund update events to connected SSE clients.
      operationId: subscribe_refund_events_v1_refunds_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/refunds/export:
    get:
      tags:
      - refunds
      summary: Export refund queue records as CSV or JSON
      description: Export refund requests matching the optional status filter in CSV
        or JSON format.
      operationId: export_refund_requests_v1_refunds_export_get
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: csv
          title: Format
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - completed
            - escalated
            - awaiting_clarification
            type: string
          - type: 'null'
          title: Status
      - name: columns
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Columns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/refunds/export/jobs:
    post:
