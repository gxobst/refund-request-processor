        content:
          application/json:
            schema:
              type: object
              properties:
                response_text:
                  type: string
                  description: Customer clarification response text.
              required:
              - response_text
          multipart/form-data:
            schema:
              type: object
              properties:
                response_text:
                  type: string
                  description: Customer clarification response text.
                evidence_file:
                  type: string
                  format: binary
                  description: Optional supporting evidence image file.
              required:
              - response_text
  /v1/refunds/{refund_id}/request-proof:
    post:
