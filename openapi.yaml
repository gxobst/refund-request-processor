openapi: 3.1.0
info:
  title: AI Refund Request Processor API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Automated back-office e-commerce refund evaluation engine powered by LangGraph,
    AWS Bedrock (Amazon Nova 2), and DynamoDB. Provides asynchronous multi-agent
    evaluation, queue status polling, multimodal evidence verification, and human-in-the-loop
    clarifications and decision overrides.
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
security: []

paths:
  /:
    get:
      operationId: getServiceInfo
      summary: Get service metadata
      description: Retrieve top-level service health and identity information.
      tags:
        - Service
      x-source: backend/app/main.py:root
      responses:
        '200':
          description: Service information successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
              example:
                status: ok
                service: refund-request-processor
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/health:
    get:
      operationId: getHealthStatus
      summary: Health check
      description: Probe endpoint for container orchestrators and load balancers to assess application liveness.
      tags:
        - Service
      x-source: backend/app/main.py:health
      responses:
        '200':
          description: Service is healthy and responsive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: healthy
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'
        '503':
          description: Service Unavailable - System dependencies are degraded or unhealthy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "urn:problem:service-unavailable"
                title: "Service Unavailable"
                status: 503
                detail: "Service is temporarily unable to handle incoming requests."
                instance: "/v1/health"

  /v1/refunds:
    get:
      operationId: listRefundRequests
      summary: List refund requests
      description: |
        Retrieve a list of refund requests from the evaluation queue with optional
        status filtering. Records are ordered by creation timestamp descending.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:list_refund_requests
      parameters:
        - name: status
          in: query
          required: false
          description: Filter refund requests by current workflow processing status.
          schema:
            $ref: '#/components/schemas/RefundStatus'
          example: escalated
        - name: limit
          in: query
          required: false
          description: Maximum number of refund records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 20
      responses:
        '200':
          description: Successfully retrieved list of refund requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundDetail'
              example:
                - refundId: ref_543c86069f0f
                  orderId: ORD-1007
                  customerRequestText: "The chair armrest arrived completely broken and cracked during delivery."
                  status: completed
                  decision: auto_approve
                  reasoning: "Refund automatically approved. Category 'damaged' satisfied all policy rules."
                  matchedPolicyRule:
                    category: damaged
                    policyName: standard_30_day_damaged
                    action: auto_approve
                    returnRequired: false
                  confidenceScore: 0.95
                  category: damaged
                  clarificationPrompt: null
                  clarificationResponse: null
                  clarificationCount: 0
                  clarificationHistory: []
                  evidence: []
                  toolCalls: []
                  approvalEmailText: "Dear Customer,\n\nYour refund request has been approved. Your RMA number is RMA-1007-AB12CD.\n\nSincerely,\nCustomer Support Team"
                  denialEmailText: null
                  clarificationEmailText: null
                  createdAt: "2026-09-23T14:10:00Z"
                  updatedAt: "2026-09-23T14:10:05Z"
                  overrideDecision: null
                  overrideReason: null
                  overriddenAt: null
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

    post:
      operationId: submitRefundRequest
      summary: Submit refund request for evaluation
      description: |
        Accept an incoming customer refund request, persist a pending record in DynamoDB,
        and schedule asynchronous multi-agent evaluation via LangGraph and AWS Bedrock.
        Supports JSON payload or multipart form data with an optional initial evidence photo.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:submit_refund_request
      requestBody:
        required: true
        description: Customer order identifier, explanation, and optional evidence image.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateRequest'
            example:
              orderId: ORD-1001
              customerRequestText: "The ceramic vase arrived shattered inside the package with no protective bubble wrap."
          multipart/form-data:
            schema:
              type: object
              required:
                - orderId
                - customerRequestText
              properties:
                orderId:
                  type: string
                  pattern: '^ORD-\d{4}$'
                  description: Identifier of the order to evaluate.
                  example: ORD-1001
                customerRequestText:
                  type: string
                  minLength: 1
                  description: Customer refund explanation.
                  example: "The ceramic vase arrived shattered inside the package."
                file:
                  type: string
                  format: binary
                  description: Optional supporting proof photo (JPEG, PNG, WebP up to 5MB).
      responses:
        '202':
          description: Refund request accepted for background processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundCreateResponse'
              example:
                refundId: ref_7f9b1c2e3a4d
                orderId: ORD-1001
                status: pending
                createdAt: "2026-09-23T14:15:30Z"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '413':
          $ref: '#/components/responses/ProblemPayloadTooLarge'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/refunds/{refundId}:
    get:
      operationId: getRefundRequestById
      summary: Get refund request details
      description: |
        Retrieve the latest status, agent classification, policy check outcome, evidence attachments,
        and final decision for a specific refund request.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:get_refund_request_by_id
      parameters:
        - $ref: '#/components/parameters/RefundIdPathParam'
      responses:
        '200':
          description: Detailed refund request record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              example:
                refundId: ref_543c86069f0f
                orderId: ORD-1007
                customerRequestText: "Received wrong shoe size (ordered 10, received 8.5)."
                status: escalated
                decision: escalate
                reasoning: "Escalated to human review due to ambiguous item condition."
                matchedPolicyRule:
                  category: wrong_item
                  policyName: wrong_item_exchange_policy
                  action: manual_review
                  returnRequired: true
                confidenceScore: 0.88
                category: wrong_item
                clarificationPrompt: null
                clarificationResponse: null
                clarificationCount: 0
                clarificationHistory: []
                evidence: []
                toolCalls: []
                approvalEmailText: null
                denialEmailText: null
                clarificationEmailText: null
                createdAt: "2026-09-23T14:10:00Z"
                updatedAt: "2026-09-23T14:10:04Z"
                overrideDecision: null
                overrideReason: null
                overriddenAt: null
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/refunds/{refundId}/override:
    post:
      operationId: overrideRefundDecision
      summary: Manually override refund decision
      description: |
        Apply a human operator decision override to an existing refund request (typically
        one escalated for human review). Transitions status to `completed` and records an
        audit trail of operator decision and rationale.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:override_refund_decision
      parameters:
        - $ref: '#/components/parameters/RefundIdPathParam'
      requestBody:
        required: true
        description: Operator manual decision and justification.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOverrideRequest'
            example:
              overrideDecision: approve
              overrideReason: "Verified return tracking code delivered to warehouse. Discretionary customer satisfaction approval."
      responses:
        '200':
          description: Override successfully recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              example:
                refundId: ref_543c86069f0f
                orderId: ORD-1007
                customerRequestText: "Received wrong shoe size (ordered 10, received 8.5)."
                status: completed
                decision: approve
                reasoning: "Escalated to human review due to ambiguous item condition."
                matchedPolicyRule:
                  category: wrong_item
                  policyName: wrong_item_exchange_policy
                  action: manual_review
                  returnRequired: true
                confidenceScore: 0.88
                category: wrong_item
                clarificationPrompt: null
                clarificationResponse: null
                clarificationCount: 0
                clarificationHistory: []
                evidence: []
                toolCalls: []
                approvalEmailText: null
                denialEmailText: null
                clarificationEmailText: null
                createdAt: "2026-09-23T14:10:00Z"
                updatedAt: "2026-09-23T14:25:12Z"
                overrideDecision: approve
                overrideReason: "Verified return tracking code delivered to warehouse. Discretionary customer satisfaction approval."
                overriddenAt: "2026-09-23T14:25:12Z"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/refunds/{refundId}/clarify:
    post:
      operationId: submitRefundClarification
      summary: Submit customer clarification
      description: |
        Provide customer clarification response for a refund request that is paused in
        `awaiting_clarification` status. Supports plain JSON text responses or multipart form
        data with an optional attached evidence image. Automatically resumes multi-agent evaluation
        in the background.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:clarify_refund_request
      parameters:
        - $ref: '#/components/parameters/RefundIdPathParam'
      requestBody:
        required: true
        description: Customer clarification response text and optional evidence image.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundClarificationRequest'
            example:
              responseText: "The package was left at the front porch in heavy rain, soaked through."
          multipart/form-data:
            schema:
              type: object
              required:
                - responseText
              properties:
                responseText:
                  type: string
                  minLength: 1
                  description: Customer clarification explanation.
                  example: "Item arrived damaged with ripped outer box."
                evidenceFile:
                  type: string
                  format: binary
                  description: Optional supporting proof photo (JPEG, PNG, WebP up to 5MB).
      responses:
        '200':
          description: Clarification accepted and workflow resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              example:
                refundId: ref_543c86069f0f
                orderId: ORD-1007
                customerRequestText: "Received wrong shoe size (ordered 10, received 8.5)."
                status: pending
                decision: null
                reasoning: null
                matchedPolicyRule: null
                confidenceScore: null
                category: wrong_item
                clarificationPrompt: "Could you please specify if the packaging was unopened?"
                clarificationResponse: "The package was left at the front porch in heavy rain, soaked through."
                clarificationCount: 1
                clarificationHistory:
                  - cycle: 1
                    prompt: "Could you please specify if the packaging was unopened?"
                    response: "The package was left at the front porch in heavy rain, soaked through."
                    timestamp: "2026-09-23T14:15:30Z"
                    evidenceIds: []
                evidence: []
                toolCalls: []
                approvalEmailText: null
                denialEmailText: null
                clarificationEmailText: null
                createdAt: "2026-09-23T14:10:00Z"
                updatedAt: "2026-09-23T14:15:30Z"
                overrideDecision: null
                overrideReason: null
                overriddenAt: null
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '413':
          $ref: '#/components/responses/ProblemPayloadTooLarge'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/refunds/{refundId}/evidence:
    post:
      operationId: uploadRefundEvidence
      summary: Upload photo evidence for a refund request
      description: |
        Upload a customer proof image (JPEG, PNG, WebP up to 5MB) for a refund request.
        If the refund request is currently paused in `awaiting_clarification` status, uploading
        evidence automatically enqueues background workflow resumption without requiring a separate
        call to `/clarify`.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:upload_refund_evidence
      parameters:
        - $ref: '#/components/parameters/RefundIdPathParam'
      requestBody:
        required: true
        description: Multipart image file to attach as proof.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Evidence photo file (JPEG, PNG, WebP up to 5MB).
      responses:
        '201':
          description: Photo evidence successfully uploaded and attached to refund record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              example:
                refundId: ref_543c86069f0f
                orderId: ORD-1007
                customerRequestText: "Received wrong shoe size (ordered 10, received 8.5)."
                status: pending
                decision: null
                reasoning: null
                matchedPolicyRule: null
                confidenceScore: null
                category: wrong_item
                clarificationPrompt: "Please provide a clear photo of the shoe box label."
                clarificationResponse: null
                clarificationCount: 1
                clarificationHistory:
                  - cycle: 1
                    prompt: "Please provide a clear photo of the shoe box label."
                    response: null
                    timestamp: "2026-09-23T14:15:30Z"
                    evidenceIds:
                      - evi_a1b2c3d4
                evidence:
                  - evidenceId: evi_a1b2c3d4
                    storageKey: refunds/ref_543c86069f0f/box_label.jpg
                    filename: box_label.jpg
                    contentType: image/jpeg
                    sizeBytes: 154230
                    url: /uploads/refunds/ref_543c86069f0f/box_label.jpg
                    createdAt: "2026-09-23T14:16:00Z"
                toolCalls: []
                approvalEmailText: null
                denialEmailText: null
                clarificationEmailText: null
                createdAt: "2026-09-23T14:10:00Z"
                updatedAt: "2026-09-23T14:16:00Z"
                overrideDecision: null
                overrideReason: null
                overriddenAt: null
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '413':
          $ref: '#/components/responses/ProblemPayloadTooLarge'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

  /v1/refunds/{refundId}/request-proof:
    post:
      operationId: requestReviewerProof
      summary: Submit reviewer proof request for an escalated refund
      description: |
        Accept an inquiry prompt from a human supervisor for an escalated refund request,
        generate a formal customer notification email instructing supported upload formats,
        and transition the refund record from `escalated` back to `awaiting_clarification`.
      tags:
        - Refunds
      x-source: backend/app/api/refunds.py:request_reviewer_proof_endpoint
      parameters:
        - $ref: '#/components/parameters/RefundIdPathParam'
      requestBody:
        required: true
        description: Reviewer proof prompt and optional customer greeting name.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerProofRequest'
            example:
              proofPrompt: "Please provide a clear photo of the serial number sticker on the base of the device."
              customerName: "Alex Morgan"
      responses:
        '200':
          description: Reviewer proof request recorded and transitioned to awaiting_clarification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              example:
                refundId: ref_543c86069f0f
                orderId: ORD-1007
                customerRequestText: "Device stopped charging after two weeks."
                status: awaiting_clarification
                decision: null
                reasoning: null
                matchedPolicyRule: null
                confidenceScore: null
                category: damaged
                clarificationPrompt: "Please provide a clear photo of the serial number sticker on the base of the device."
                clarificationResponse: null
                clarificationCount: 1
                clarificationHistory:
                  - cycle: 1
                    prompt: "Please provide a clear photo of the serial number sticker on the base of the device."
                    response: null
                    timestamp: "2026-09-23T14:30:00Z"
                    evidenceIds: []
                evidence: []
                toolCalls: []
                approvalEmailText: null
                denialEmailText: null
                clarificationEmailText: "Dear Alex Morgan,\n\nOur quality review team requires additional proof regarding order ORD-1007.\nPlease provide a clear photo of the serial number sticker on the base of the device.\n\nAccepted formats: JPEG, PNG, WebP up to 5MB."
                createdAt: "2026-09-23T14:10:00Z"
                updatedAt: "2026-09-23T14:30:00Z"
                overrideDecision: null
                overrideReason: null
                overriddenAt: null
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '422':
          $ref: '#/components/responses/ProblemUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'

components:
  parameters:
    RefundIdPathParam:
      name: refundId
      in: path
      required: true
      description: Unique identifier of the refund request (e.g. `ref_543c86069f0f`).
      schema:
        type: string
        pattern: '^ref_[a-zA-Z0-9]+$'
      example: ref_543c86069f0f

  responses:
    ProblemBadRequest:
      description: Bad Request - Malformed request parameters or invalid payload syntax.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:problem:bad-request"
            title: "Bad Request"
            status: 400
            detail: "The request query parameters could not be parsed."
            instance: "/v1/refunds"

    ProblemNotFound:
      description: Not Found - The specified resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:problem:not-found"
            title: "Resource Not Found"
            status: 404
            detail: "Refund request 'ref_nonexistent123' not found."
            instance: "/v1/refunds/ref_nonexistent123"

    ProblemPayloadTooLarge:
      description: Payload Too Large - Uploaded evidence exceeds maximum file size limit (5MB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:problem:payload-too-large"
            title: "Payload Too Large"
            status: 413
            detail: "File size exceeds maximum allowed limit of 5.0 MB."
            instance: "/v1/refunds/ref_543c86069f0f/evidence"
      x-source: backend/app/api/refunds.py:HTTP_413_STATUS

    ProblemUnprocessableEntity:
      description: Unprocessable Content - Request payload failed schema validation rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: "urn:problem:validation-error"
            title: "Validation Error"
            status: 422
            detail: "One or more fields in the request body failed validation."
            instance: "/v1/refunds"
            invalidParams:
              - name: "orderId"
                reason: "Field cannot be blank or empty."

    ProblemInternalServerError:
      description: Internal Server Error - An unexpected error occurred while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:problem:internal-server-error"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred while accessing persistence storage."
            instance: "/v1/refunds"

  schemas:
    ServiceInfo:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Service health indicator.
          example: ok
        service:
          type: string
          description: Microservice identifier name.
          example: refund-request-processor
      x-source: backend/app/main.py:root

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Liveness status of the API service.
          example: healthy
      x-source: backend/app/main.py:health

    RefundStatus:
      type: string
      enum:
        - pending
        - completed
        - escalated
        - awaiting_clarification
      description: |
        Lifecycle evaluation status of the refund request:
        * `pending`: In queue or actively being evaluated by multi-agent workflow.
        * `completed`: Decision reached (automated or manually overridden).
        * `escalated`: Escalated to human operator review due to low confidence, policy ambiguity, or order amount threshold.
        * `awaiting_clarification`: Paused awaiting customer details or photo clarification.
      example: pending
      x-source: backend/app/schemas/refund.py:RefundStatus

    RefundDecision:
      type: string
      enum:
        - auto_approve
        - deny
        - escalate
        - approve
      description: |
        Outcome decision for the refund request:
        * `auto_approve`: Automatically approved by policy evaluation.
        * `deny`: Ineligible under policy rules.
        * `escalate`: Transferred to human review queue.
        * `approve`: Manually approved by human operator override.
      example: auto_approve
      x-source: backend/app/schemas/refund.py:RefundDecision

    RefundCategory:
      type: string
      enum:
        - damaged
        - wrong_item
        - changed_mind
        - late_delivery
        - missing_item
      description: Classified reason category determining policy rules and evidence mandates.
      example: damaged
      x-source: backend/app/schemas/refund.py:RefundRecord.category

    OverrideDecisionType:
      type: string
      enum:
        - approve
        - deny
      description: Final determination selected by human reviewer.
      example: approve
      x-source: backend/app/schemas/refund.py:OverrideDecisionType

    RefundCreateRequest:
      type: object
      required:
        - orderId
        - customerRequestText
      properties:
        orderId:
          type: string
          pattern: '^ORD-\d{4}$'
          description: Associated purchase order identifier.
          example: ORD-1001
        customerRequestText:
          type: string
          minLength: 1
          description: Customer-submitted explanation or reason for requesting a refund.
          example: "The ceramic vase arrived shattered inside the package with no protective bubble wrap."
      x-source: backend/app/schemas/refund.py:RefundCreateRequest

    RefundCreateResponse:
      type: object
      required:
        - refundId
        - orderId
        - status
        - createdAt
      properties:
        refundId:
          type: string
          description: Unique generated refund request identifier.
          example: ref_7f9b1c2e3a4d
        orderId:
          type: string
          description: Associated purchase order identifier.
          example: ORD-1001
        status:
          $ref: '#/components/schemas/RefundStatus'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 creation timestamp.
          example: "2026-09-23T14:15:30Z"
      x-source: backend/app/schemas/refund.py:RefundCreateResponse

    RefundClarificationRequest:
      type: object
      required:
        - responseText
      properties:
        responseText:
          type: string
          minLength: 1
          description: Customer-provided clarification response text.
          example: "The package was left at the front porch in heavy rain, soaked through."
      x-source: backend/app/schemas/refund.py:RefundClarificationRequest

    RefundOverrideRequest:
      type: object
      required:
        - overrideDecision
        - overrideReason
      properties:
        overrideDecision:
          $ref: '#/components/schemas/OverrideDecisionType'
        overrideReason:
          type: string
          minLength: 1
          description: Operator explanation justifying the manual decision override.
          example: "Photographic proof confirmed package damage prior to delivery."
          x-tentative: true
      x-source: backend/app/schemas/refund.py:RefundOverrideRequest

    ReviewerProofRequest:
      type: object
      required:
        - proofPrompt
      properties:
        proofPrompt:
          type: string
          minLength: 1
          description: Targeted proof request prompt sent to the customer.
          example: "Please provide a clear photo of the serial number sticker on the base of the device."
        customerName:
          type:
            - string
            - 'null'
          description: Optional customer name for email greeting.
          example: "Alex Morgan"
          x-tentative: true
