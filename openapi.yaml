      - name: refund_id
        in: path
        required: true
        schema:
          type: string
          title: Refund Id
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
          title: Evidence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
